services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/MyApp
      SESSION_SECRET: "${SESSION_SECRET:?Set SESSION_SECRET before starting the stack}"
      APP_URL: "${APP_URL:-http://localhost:3000}"
      SMTP_URL: "${SMTP_URL:-}"
      EMAIL_FROM: "${EMAIL_FROM:-Fi Tri9i <no-reply@fi-tri9i.dz>}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      RATE_LIMIT_STORE: "${RATE_LIMIT_STORE:-mongo}"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
