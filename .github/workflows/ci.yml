name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install the dependencies
        run: npm ci

      - name: Lint the sources
        run: npm run lint

      # The test suite replaces the models with in memory doubles, it needs
      # no MongoDB instance.
      - name: Run the test suite
        run: npm test
